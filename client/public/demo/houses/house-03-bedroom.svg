      <stop offset="0%" stop-color="#fefce8" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
  </defs>

  <rect width="800" height="350" fill="url(#wallGrad)" />
  <rect y="350" width="800" height="150" fill="#94a3b8" />

