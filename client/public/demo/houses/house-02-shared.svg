<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <title>Mount Lavinia Student Annex - Kitchen and Shared Area</title>
  <desc>Contemporary shared pantry and lounge with refrigerator, microwave oven, water filter, and dining chairs.</desc>
  <defs>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
  </defs>

  <rect width="800" height="360" fill="url(#wallGrad)" />
  <rect y="360" width="800" height="140" fill="#cbd5e1" />

  <rect x="40" y="280" width="360" height="130" fill="#334155" rx="2" />
  <rect x="460" y="280" width="300" height="20" fill="#b45309" stroke="#78350f" stroke-width="2" rx="2" />

  <rect x="24" y="24" width="420" height="68" rx="8" fill="#0f172a" fill-opacity="0.88" />
  <text x="40" y="52" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700">Mount Lavinia Student Annex</text>
  <text x="40" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Mount Lavinia, Dehiwala • Shared Facilities</text>
</svg>